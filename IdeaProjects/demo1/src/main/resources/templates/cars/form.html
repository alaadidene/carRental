<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${car.id} ? 'Modifier voiture' : 'Nouvelle voiture'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${car.id} ? 'Modifier la voiture' : 'Ajouter une voiture'"></h1>

    <form th:action="@{/web/cars/save}" th:object="${car}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Marque</label>
            <input type="text" class="form-control" th:field="*{brand}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Modèle</label>
            <input type="text" class="form-control" th:field="*{model}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Immatriculation</label>
            <input type="text" class="form-control" th:field="*{registrationNumber}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Statut</label>
            <select class="form-select" th:field="*{status}">
                <option value="AVAILABLE">Disponible</option>
                <option value="RENTED">Loué</option>
                <option value="MAINTENANCE">En maintenance</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Prix par jour</label>
            <input type="number" step="0.01" class="form-control" th:field="*{pricePerDay}" required>
        </div>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/web/cars}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
</body>
</html>
