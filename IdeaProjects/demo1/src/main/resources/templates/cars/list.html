<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Voitures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Liste des Voitures</h1>

    <a th:href="@{/web/cars/form}" class="btn btn-primary mb-3">Ajouter une voiture</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Marque</th>
            <th>Modèle</th>
            <th>Immatriculation</th>
            <th>Statut</th>
            <th>Prix/jour</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="car : ${cars}">
            <td th:text="${car.id}"></td>
            <td th:text="${car.brand}"></td>
            <td th:text="${car.model}"></td>
            <td th:text="${car.registrationNumber}"></td>
            <td th:text="${car.status}"></td>
            <td th:text="${car.pricePerDay}"></td>
            <td>
                <a th:href="@{/web/cars/form(id=${car.id})}" class="btn btn-sm btn-warning">Modifier</a>
                <a th:href="@{/web/cars/delete/{id}(id=${car.id})}" class="btn btn-sm btn-danger">Supprimer</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
